name: Build diagnostic engine image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref containing the engine changes
        required: true
        default: main
        type: string
      image_tag:
        description: GHCR image tag
        required: true
        type: string
      engine_version:
        description: Semantic version embedded in the engine binary
        required: true
        default: v0.110.23
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-engine:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hatchet
          POSTGRES_PASSWORD: hatchet
          POSTGRES_DB: hatchet
        ports:
          - 5431:5432
        options: >-
          --health-cmd "pg_isready -U hatchet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Validate inputs
        env:
          ENGINE_VERSION: ${{ inputs.engine_version }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$ ]]; then
            echo "Invalid image tag: $IMAGE_TAG" >&2
            exit 1
          fi
          if [[ ! "$ENGINE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid engine version: $ENGINE_VERSION" >&2
            exit 1
          fi

      - name: Clone repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source_ref }}

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test notification delivery
        env:
          SERVER_SECURITY_CHECK_ENABLED: "false"
          DATABASE_URL: postgresql://hatchet:hatchet@127.0.0.1:5431/hatchet
        run: |
          awk '/^CREATE TABLE "MessageQueue" \(/,/^\);/; /^CREATE TYPE "MessageQueueItemStatus" AS ENUM \(/,/^\);/; /^CREATE TABLE "MessageQueueItem" \(/,/^\);/' \
            sql/schema/v0.sql | psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          go test -race ./internal/msgqueue ./internal/msgqueue/postgres ./internal/services/dispatcher \
            -run 'Test(PubTenantMessage|PostgresPubSubRebindRetry|CreatedTaskStreamProjectionCompatibility|TenantStreamMsgIDsInSync)' -count=1
          go test -race -tags integration ./internal/msgqueue/postgres -run TestPostgres -count=1 -timeout 2m

      - name: Test scheduler refresh and event backpressure
        env:
          SERVER_SECURITY_CHECK_ENABLED: "false"
        run: go test -race ./pkg/scheduling/v1 ./internal/services/scheduler/v1 ./internal/msgqueue -count=1 -timeout 2m

      - name: Build engine
        env:
          ENGINE_VERSION: ${{ inputs.engine_version }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          docker build \
            --file ./build/package/servers.dockerfile \
            --build-arg SERVER_TARGET=engine \
            --build-arg "VERSION=$ENGINE_VERSION" \
            --label org.opencontainers.image.revision="$(git rev-parse HEAD)" \
            --tag "ghcr.io/boynchan/hatchet-engine:$IMAGE_TAG" \
            .

      - name: Verify engine version
        env:
          ENGINE_VERSION: ${{ inputs.engine_version }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          actual_version="$(docker run --rm \
            --env SERVER_SECURITY_CHECK_ENABLED=false \
            "ghcr.io/boynchan/hatchet-engine:$IMAGE_TAG" \
            /hatchet/hatchet-engine --version)"
          if [[ "$actual_version" != "$ENGINE_VERSION" ]]; then
            echo "Engine version mismatch: expected $ENGINE_VERSION, got $actual_version" >&2
            exit 1
          fi

      - name: Push engine
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: docker push "ghcr.io/boynchan/hatchet-engine:$IMAGE_TAG"
